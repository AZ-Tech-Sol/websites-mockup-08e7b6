<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="robots" content="noindex, nofollow"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Crew test (mockup)</title>
<style>body{margin:0;background:#0E121A;color:#EEF3F7;font:16px/1.6 Inter,system-ui,sans-serif;padding:24px}.row{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:24px;max-width:1100px;margin:0 auto}@media(max-width:700px){.row{grid-template-columns:1fr}}figure{margin:0;display:grid;gap:10px;text-align:center}img{width:100%;height:auto;border-radius:14px}b{font-size:18px}figcaption{color:#829DAE;font-size:14px}h1{text-align:center;font-size:22px;font-weight:600}</style></head>
<body><h1>Hector, two directions · dangerous to the problem, safe for the hero</h1><div class="row">
<figure><img src="assets/test-hector-a.svg" alt="Test A: Hector as an anime mecha hero"><figcaption><b>A · Anime mecha</b><br>Crested helmet, determined eyes, a small smile, thumbs up.</figcaption></figure>
<figure><img src="assets/test-hector-b.svg" alt="Test B: Hector as a ranger-squad hero"><figcaption><b>B · Ranger squad</b><br>Sleek helmet, expressive eye lights, a salute, the Clockwork gear on the chest. One colour per crew member.</figcaption></figure>
</div></body></html>
